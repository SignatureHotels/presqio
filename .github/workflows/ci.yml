name: Validate monorepo
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: presqio
          POSTGRES_PASSWORD: presqio_local
          POSTGRES_DB: presqio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U presqio -d presqio"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      VITE_API_URL: /api/v1
      DATABASE_URL: postgresql://presqio:presqio_local@localhost:5432/presqio?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn db:deploy
      - run: yarn db:status
      - run: yarn db:seed
      - run: yarn db:seed
      - run: node scripts/test-database.cjs
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build
      - name: Build backend Docker image
        run: docker build --file apps/backend/Dockerfile --tag presqio-backend:ci .
      - name: Build frontend Docker image
        run: docker build --file apps/frontend/Dockerfile --build-arg VITE_API_URL=/api/v1 --tag presqio-frontend:ci .
