services:
  - type: web
    name: presqio-backend
    runtime: docker
    # Paid instance supports the SMTP verification/reset emails used by this app.
    plan: starter
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: UI_ORIGIN
        sync: false
      - key: APP_URL
        sync: false
